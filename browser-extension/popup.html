<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دستیار رابین</title><style>
body{font:13px Tahoma,Arial;width:320px;padding:14px;color:#182230}h3{margin:0 0 10px}textarea{width:100%;height:120px;box-sizing:border-box;direction:ltr;font:12px monospace}button{width:100%;padding:10px;margin-top:9px;background:#175cd3;color:white;border:0;border-radius:7px;cursor:pointer}p{line-height:1.8;color:#475467}.warn{color:#b42318;font-weight:bold}#status{white-space:pre-wrap;line-height:1.7}
</style></head><body>
<h3>دستیار رابین | ورود اطلاعات دستی</h3>
<p>اطلاعات سفارش را به شکل JSON وارد کن. افزونه فقط فیلدهای فرم را پر می‌کند و هرگز دکمه ثبت سفارش را نمی‌زند.</p>
<textarea id="order" spellcheck="false">{
  "symbol": "نماد",
  "side": "buy",
  "price": 10000,
  "quantity": 100
}</textarea>
<button id="fill">پر کردن فرم همین صفحه</button>
<p class="warn">قبل از ثبت سفارش، همه مقادیر را در سایت کارگزاری بررسی کن.</p><div id="status" role="status"></div>
<script src="popup.js"></script></body></html>
