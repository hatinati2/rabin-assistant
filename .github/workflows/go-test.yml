name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check preview installer syntax
        run: bash -n install-preview.sh deploy/install-preview.sh
      - name: Run tests
        run: go test ./...
      - name: Build server
        run: go build ./cmd/server
      - name: Vet
        run: go vet ./...
