name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check preview installer syntax
        run: bash -n install-preview.sh deploy/install-preview.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          source = Path("cmd/server/main.go").read_text()
          start = source.index("<script>") + len("<script>")
          end = source.index("</script>", start)
          script = source[start:end]
          with tempfile.NamedTemporaryFile("w", suffix=".js") as js_file:
              js_file.write(script)
              js_file.flush()
              subprocess.run(["node", "--check", js_file.name], check=True)
          PY
      - name: Run tests
        run: go test ./...
      - name: Build server
        run: go build ./cmd/server
      - name: Vet
        run: go vet ./...
